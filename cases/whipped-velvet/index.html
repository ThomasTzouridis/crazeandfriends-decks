<style>
:root{--paper:#fff;--ink:#131410;--muted:#5f605b;--line:#d9d9d4;--hi:#F0E933;
--display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Chivo",system-ui,"Segoe UI",sans-serif;--mono:"Chivo Mono",ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body)}
main{max-width:980px;margin:0 auto;padding:28px 20px 56px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line)}
header img{height:34px;width:auto;display:block}
.eyebrow{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(44px,9vw,92px)/.92 var(--display);text-transform:uppercase;margin:28px 0 0;text-wrap:balance}
.res{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin:20px 0 26px}
.num{font:800 clamp(30px,6vw,52px)/1 var(--display);background:var(--hi);padding:.1em .2em 0;white-space:nowrap}
.res p{margin:0;font-size:clamp(17px,2.4vw,22px);line-height:1.35;max-width:34ch}
video{display:block;width:100%;aspect-ratio:16/9;background:#131410}
.btn{display:inline-block;margin-top:28px;background:var(--ink);color:#fff;text-decoration:none;font:500 15px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:16px 24px}
.btn:hover,.btn:focus-visible{background:var(--hi);color:var(--ink);outline:none}
</style>
</head>
<body>
<main>
  <header><img src="../../assets/cf-logo.png" alt="craze&amp;friends"><span class="eyebrow">Case study</span></header>
  <p class="eyebrow" style="margin-top:28px">2026 · Skincare</p>
  <h1 style="margin-top:8px">Whipped Velvet</h1>
  <div class="res"><span class="num">0 → live store</span><p>logo, packaging, copy and a Shopify store, built from nothing by one team</p></div>
  <video src="../../assets/video/whippedvelvet.mp4" poster="../../assets/work/whippedvelvet.jpg" controls playsinline preload="metadata" controlslist="nodownload"></video>
  <a class="btn" href="https://calendly.com/og_crazeandfriends/30min?utm_source=cf-case&amp;utm_campaign=whipped-velvet" target="_blank" rel="noopener">Book a call →</a>
</main>
